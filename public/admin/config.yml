backend:
  name: github
  repo: "adragut/echilibru_web"  # TODO: Replace with your actual repo path
  branch: main
  base_url: "https://decap.echilibru.ro"  # TODO: Replace with your proxy domain
  auth_endpoint: "auth"
  open_authoring: false

media_folder: "public/assets/images"
public_folder: "/assets/images"
media_folder: "src/assets/images"
public_folder: "/assets/images"

site_url: "https://echilibru.ro"

# Enable the editorial workflow (draft/review/publish)
publish_mode: editorial_workflow

collections:
  - name: "seo"
    label: "SEO"
    files:
      - file: "src/content/seo/seo.json"
        label: "SEO Settings"
        name: "seo"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}

  - name: "navigation"
    label: "Navigation"
    files:
      - file: "src/content/navigation/navigation.json"
        label: "Navigation"
        name: "navigation"
        fields:
          - {label: "Logo", name: "logo", widget: "string"}
          - label: "Links"
            name: "links"
            widget: "list"
            fields:
              - {label: "Href", name: "href", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
          - {label: "CTA Text", name: "cta", widget: "string"}

  - name: "hero"
    label: "Hero Section"
    files:
      - file: "src/content/hero/hero.json"
        label: "Hero Content"
        name: "hero"
        fields:
          - {label: "Headline", name: "headline", widget: "string"}
          - {label: "Subheadline", name: "subheadline", widget: "text"}
          - {label: "Primary CTA", name: "ctaPrimary", widget: "string"}
          - {label: "Secondary CTA", name: "ctaSecondary", widget: "string"}
          - {label: "Image Alt", name: "imageAlt", widget: "string"}

  - name: "philosophie"
    label: "Filosofie"
    files:
      - file: "src/content/philosophie/philosophie.json"
        label: "Filosofie Content"
        name: "philosophie"
        fields:
          - {label: "Section Title", name: "sectionTitle", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Values"
            name: "values"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Icon (users/sun/heart)", name: "icon", widget: "select", options: ["users", "sun", "heart"]}

  - name: "servicii"
    label: "Servicii"
    files:
      - file: "src/content/servicii/servicii.json"
        label: "Servicii Content"
        name: "servicii"
        fields:
          - {label: "Section Title", name: "sectionTitle", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Cards"
            name: "cards"
            widget: "list"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image Alt", name: "imageAlt", widget: "string"}

  - name: "echipa"
    label: "Echipa (Cai)"
    files:
      - file: "src/content/echipa/echipa.json"
        label: "Echipa Content"
        name: "echipa"
        fields:
          - {label: "Section Title", name: "sectionTitle", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Members"
            name: "members"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Special Trait", name: "specialTrait", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Image Alt", name: "imageAlt", widget: "string"}

  - name: "contact"
    label: "Contact"
    files:
      - file: "src/content/contact/contact.json"
        label: "Contact Content"
        name: "contact"
        fields:
          - {label: "Section Title", name: "sectionTitle", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Form"
            name: "form"
            widget: "object"
            fields:
              - {label: "Name Label", name: "nameLabel", widget: "string"}
              - {label: "Email Label", name: "emailLabel", widget: "string"}
              - {label: "Service Label", name: "serviceLabel", widget: "string"}
              - {label: "Message Label", name: "messageLabel", widget: "string"}
              - {label: "Submit Button", name: "submit", widget: "string"}
              - label: "Service Options"
                name: "serviceOptions"
                widget: "list"
                field: {label: "Option", name: "option", widget: "string"}
          - label: "Social Media"
            name: "socialMedia"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "Links"
                name: "links"
                widget: "list"
                fields:
                  - {label: "Platform", name: "platform", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
                  - {label: "Icon", name: "icon", widget: "select", options: ["facebook", "instagram"]}
          - label: "Info"
            name: "info"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - label: "Address"
                name: "address"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - label: "Lines"
                    name: "lines"
                    widget: "list"
                    field: {label: "Line", name: "line", widget: "string"}
              - label: "Phone"
                name: "phone"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Value", name: "value", widget: "string"}
              - label: "Email"
                name: "email"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "Value", name: "value", widget: "string"}
          - {label: "Map URL", name: "mapUrl", widget: "string"}

  - name: "footer"
    label: "Footer"
    files:
      - file: "src/content/footer/footer.json"
        label: "Footer Content"
        name: "footer"
        fields:
          - {label: "Logo", name: "logo", widget: "string"}
          - {label: "Tagline", name: "tagline", widget: "string"}
          - label: "Links"
            name: "links"
            widget: "list"
            fields:
              - {label: "Href", name: "href", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}
          - {label: "Copyright", name: "copyright", widget: "string"}
          - {label: "Tagline 2", name: "tagline2", widget: "string"}

  - name: "about"
    label: "Despre"
    files:
      - file: "src/content/about/about.json"
        label: "About Content"
        name: "about"
        fields:
          - {label: "Section Title", name: "sectionTitle", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - {label: "Image Alt", name: "imageAlt", widget: "string"}
          - {label: "Passion Title", name: "passionTitle", widget: "string"}
          - {label: "Passion Text 1", name: "passionText1", widget: "text"}
          - {label: "Passion Text 2", name: "passionText2", widget: "text"}
          - label: "Badges"
            name: "badges"
            widget: "list"
            field: {label: "Badge", name: "badge", widget: "string"}

  - name: "assets"
    label: "Assets (Image Paths)"
    files:
      - file: "src/content/assets/assets.json"
        label: "Image Paths"
        name: "assets"
        fields:
          - {label: "Hero Image", name: "hero", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Hero Secondary Image", name: "heroSecondary", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "About Image", name: "about", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Logo", name: "logo", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Service Dezvoltare", name: "serviceDezvoltare", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Service Hipoterapie", name: "serviceHipoterapie", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Service Teambuilding", name: "serviceTeambuilding", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Anabelle", name: "teamAnabelle", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Pony", name: "teamPony", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Aris", name: "teamAris", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Cappuchino", name: "teamCappuchino", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Cioco", name: "teamCioco", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Argo", name: "teamArgo", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Yuki", name: "teamYuki", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Scoty", name: "teamScoty", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Ria", name: "teamRia", widget: "image", media_library: {config: {multiple: false}}}
          - {label: "Team Onyx", name: "teamOnyx", widget: "image", media_library: {config: {multiple: false}}}
