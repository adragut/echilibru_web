<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</head>
<body>
  <script>
    // Initialize Decap CMS
    window.CMS_MANUAL_INIT = true;
    
    // Use local backend when running locally
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    
    const config = {
      backend: {
        name: 'git-gateway',
        branch: 'main',
        local_backend: isLocal
      }
    };
    
    if (isLocal) {
      // For local development, we'll load the local config
      fetch('/admin/config.local.yml')
        .then(res => res.text())
        .then(yaml => {
          // Parse YAML manually or use the loaded config
          config.backend.local_backend = true;
          CMS.init({ config });
        })
        .catch(() => {
          CMS.init({ config });
        });
    } else {
      CMS.init({ config });
    }
  </script>
</body>
</html>
