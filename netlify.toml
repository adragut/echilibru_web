# Netlify configuration for echilibru.ro
# git-gateway backend works automatically with Netlify Identity

[build]
  command = "npm run build"
  publish = "dist"
  functions = "dist/server"

# Enable Netlify Identity for git-gateway auth
[identity]
  enabled = true

# Git Gateway (required for Decap CMS)
[git-gateway]
  enabled = true

# Build environment
[build.environment]
  NODE_VERSION = "20"

# Edge functions for optimal performance
[[edge_functions]]
  path = "/*"
  function = "server"

# Cache headers for static assets
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Redirects
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# SPA fallback for clean URLs (if needed)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200