name = "echilibru-web"
main = "src/server/index.js"
compatibility_date = "2026-08-14"
compatibility_flags = ["nodejs_compat", "disable_nodejs_process_v2"]

[vars]
NODE_ENV = "production"
SENDER_EMAIL = "onboarding@resend.dev"
RECIPIENT_EMAIL = "terapie.echilibru@gmail.com"
GMAIL_USER="terapie.echilibru@gmail.com"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1